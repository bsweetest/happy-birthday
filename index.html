<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { background: #FFF0F6; color: #333; display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; overflow-y: auto; padding: 20px 0; }
.container { width: 100%; max-width: 420px; padding: 20px; text-align: center; position: relative; }
.countdown { font-size: 120px; font-weight: 700; color: #E11D48; margin: 60px 0; animation: pop 0.5s ease; }
.loading { color: #999; font-size: 14px; letter-spacing: 1px; }
.dots span { display: inline-block; width: 6px; height: 6px; background: #D1D5DB; border-radius: 50%; margin: 0 3px; animation: blink 1.4s infinite; }
.dots span:nth-child(2){ animation-delay: 0.2s }
.dots span:nth-child(3){ animation-delay: 0.4s }
  @keyframes blink { 0%,80%,100%{opacity:0} 40%{opacity:1} }
  @keyframes pop { 0%{transform:scale(0.5);opacity:0} 100%{transform:scale(1);opacity:1} }

.card { background: white; border-radius: 24px; padding: 30px 24px; box-shadow: 0 8px 30px rgba(225,29,72,0.08); margin-top: 20px; position: relative; overflow: hidden; }

/* KUE PERSIS KAYA FOTO KAMU */
.cake { width: 160px; height: 50px; background: #93C5FD; border-radius: 12px; margin: 25px auto 10px; position: relative; box-shadow: 0 4px 0 #60A5FA; }
.cake-dots { position: absolute; width: 100%; height: 100%; top: 0; left: 0; }
.cake-dots span { position: absolute; width: 8px; height: 8px; background: #FBBF24; border-radius: 50%; }
.candle { width: 12px; height: 35px; background: #60A5FA; margin: 0 auto; border-radius: 6px; position: relative; top: -25px; }
.flame { width: 18px; height: 24px; background: radial-gradient(circle at 50% 30%, #FFD700, #FF8C00); border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%; position: absolute; top: -22px; left: -3px; animation: flicker 0.5s infinite alternate; cursor: pointer; box-shadow: 0 0 15px #FFD700; }
  @keyframes flicker { from{transform:scale(1)} to{transform:scale(1.1)} }

/* BACKGROUND LOVE UNTUK PAGE 1 */
.page1-bg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; opacity: 0.15; }
.heart { position: absolute; color: #EC4899; font-size: 20px; animation: float 3s ease-in-out infinite; }
@keyframes float { 0%,100%{transform: translateY(0)} 50%{transform: translateY(-10px)} }

/* KURSOR KEDIP BUAT TYPING */
.cursor { display: inline-block; width: 2px; height: 1em; background: #A855F7; animation: blink-cursor 0.8s infinite; margin-left: 2px; vertical-align: text-bottom; }
@keyframes blink-cursor { 0%,50%{opacity:1} 51%,100%{opacity:0} }

.btns { display: flex; justify-content: center; gap: 16px; margin-top: 20px; }
.btn { width: 44px; height: 44px; border-radius: 50%; background: #A855F7; color: white; border: none; font-size: 20px; cursor: pointer; box-shadow: 0 4px 10px rgba(168,85,247,0.3); }
.confetti { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 999; }
.confetti-piece { position: absolute; width: 8px; height: 8px; background: #8B5CF6; opacity: 0; animation: fall 3s linear forwards; }
  @keyframes fall { to { transform: translateY(100vh) rotate(360deg); opacity: 1; } }
.hidden { display: none!important; }
.handwritten { font-family: 'Comic Sans MS', cursive; font-size: 22px; line-height: 1.8; }
</style>
</head>
<body>

<div class="container">

  <!-- Screen 1: Countdown -->
  <div id="screen1">
    <div class="countdown" id="count">3</div>
    <div class="loading">just a moment</div>
    <div class="dots"><span></span><span></span><span></span></div>
  </div>

  <!-- Screen 2: Cake -->
  <div id="screen2" class="hidden">
    <div class="card">
      <div style="color:#E11D48; font-weight:600; font-size:16px;">Make a Wish! 🎂</div>
      <div class="cake">
        <div class="cake-dots">
          <span style="top:10px; left:20px;"></span>
          <span style="top:20px; left:50px; background:#F472B6;"></span>
          <span style="top:8px; left:90px; background:#10B981;"></span>
          <span style="top:18px; left:120px;"></span>
        </div>
        <div class="candle"><div class="flame" id="flame"></div></div>
      </div>
      <div style="font-size:12px; color:#666;">Tap apinya untuk meniup lilin! 🕯️</div>
    </div>
  </div>

  <!-- Screen 3: Pages -->
  <div id="screen3" class="hidden">
    <div class="card">
      <div class="page1-bg" id="hearts-bg"></div>
      <div id="pageContent"></div>
      <div style="font-size:12px; color:#999; margin-top:15px;" id="pageNum"></div>
      <div class="btns">
        <button class="btn" onclick="prevPage()"><</button>
        <button class="btn" onclick="nextPage()">></button>
      </div>
    </div>
  </div>
</div>

<div class="confetti" id="confetti"></div>

<audio id="bgmusic" loop>
  <source src="birthday song.mp3" type="audio/mpeg">
</audio>

<script>
let page = 0;
let typingInterval;
const music = document.getElementById('bgmusic');
const flame = document.getElementById('flame');

document.body.addEventListener('click', () => {
  if(music.paused) music.play().catch(()=>{});
}, {once: true});

let count = 3;
const countEl = document.getElementById('count');
const interval = setInterval(() => {
  count--;
  if(count > 0) {
    countEl.textContent = count;
    countEl.style.animation = 'none';
    void countEl.offsetWidth;
    countEl.style.animation = 'pop 0.5s ease';
  } else {
    clearInterval(interval);
    showConfetti();
    setTimeout(() => {
      document.getElementById('screen1').classList.add('hidden');
      document.getElementById('screen2').classList.remove('hidden');
    }, 800);
  }
}, 1000);

flame.addEventListener('click', () => {
  flame.style.display = 'none';
  showConfetti();
  setTimeout(() => {
    document.getElementById('screen2').classList.add('hidden');
    document.getElementById('screen3').classList.remove('hidden');
    createHearts();
    renderPage();
  }, 800);
});

function createHearts(){
  const bg = document.getElementById('hearts-bg');
  bg.innerHTML = '';
  for(let i=0; i<12; i++){
    const heart = document.createElement('div');
    heart.className = 'heart';
    heart.innerHTML = '❤️';
    heart.style.left = Math.random()*100 + '%';
    heart.style.top = Math.random()*100 + '%';
    heart.style.animationDelay = Math.random()*2 + 's';
    bg.appendChild(heart);
  }
}

const fullTextPage2 = `<img src="weverse_20260803164103.jpg" style="width:100%; border-radius:16px; margin-bottom:12px;">
   <div style="text-align:left; font-size:15px; line-height:1.8;" id="typing-text">
   <b>happy birthday to a genuinely good person.</b><br><br>
   you inspire me in so many quiet ways — through how you care, how you stay real, and how you choose kindness even on hard days. i hope life keeps treating you as gently as you treat others. i hope you get to laugh a lot this year, feel proud of how far you’ve come, and collect so many beautiful little memories.<br><br>
   keep being the person who makes the world feel a little softer. keep smiling, keep growing, and never lose that heart of yours. i’m really grateful you exist, kael. be happy always.
   </div>`;

const pages = [
  `<div style="font-size:20px; font-weight:600; line-height:1.6; position:relative; z-index:2;">
    to the person who got the "best person" stamp from me last year.
   </div>`,
  fullTextPage2, // ini nanti di typing
  `<div class="handwritten">
   <div style="color:orange; font-size:24px;">☀️</div>
   <span style="color:#8B5CF6;">always rooting</span><br>
   <span style="color:#EC4899;">for you</span><br>
   <span style="color:#10B981;">from afar</span><br>
   </div>`
];

function typeWriter(element, html, speed = 25){
  clearInterval(typingInterval);
  element.innerHTML = '';
  let i = 0;
  const cursor = '<span class="cursor"></span>';

  // pisahin tag html biar ga ke-typing
  const tempDiv = document.createElement('div');
  tempDiv.innerHTML = html;
  const text = tempDiv.innerText;

  typingInterval = setInterval(() => {
    if(i < text.length){
      element.innerHTML = text.substring(0, i+1) + cursor;
      i++;
      element.scrollTop = element.scrollHeight; // auto scroll pas ngetik
    } else {
      clearInterval(typingInterval);
      element.innerHTML = text; // hapus kursor pas selesai
    }
  }, speed);
}

function renderPage(){
  clearInterval(typingInterval);
  document.getElementById('pageNum').textContent = `Page ${page+1} of ${pages.length}`;

  if(page === 1){ // CUMA PAGE 2 YANG DI TYPING
    document.getElementById('pageContent').innerHTML = `<img src="weverse_20260803164103.jpg" style="width:100%; border-radius:16px; margin-bottom:12px;"><div id="typing-text" style="text-align:left; font-size:15px; line-height:1.8;"></div>`;
    const typingEl = document.getElementById('typing-text');
    const tempDiv = document.createElement('div');
    tempDiv.innerHTML = pages[1].split('</div>')[1]; // ambil text nya aja
    typeWriter(typingEl, tempDiv.innerHTML, 20); // 20ms = cepet. ganti 40 kalau mau lebih lambat
  } else {
    document.getElementById('pageContent').innerHTML = pages[page];
  }

  if(page === 0) createHearts();
  window.scrollTo(0,0);
}

function nextPage(){ if(page < pages.length-1){ page++; renderPage(); } }
function prevPage(){ if(page > 0){ page--; renderPage(); } }

function showConfetti(){
  const confetti = document.getElementById('confetti');
  confetti.innerHTML = '';
  for(let i=0; i<50; i++){
    const piece = document.createElement('div');
    piece.className = 'confetti-piece';
    piece.style.left = Math.random()*100 + '%';
    piece.style.background = ['#A855F7','#EC4899','#F59E0B','#10B981'][Math.floor(Math.random()*4)];
    piece.style.animationDelay = Math.random()*0.5 + 's';
    confetti.appendChild(piece);
  }
}
</script>
</body>
</html>
