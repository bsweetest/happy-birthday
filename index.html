<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { background: #FFF5F8; color: #333; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }
.container { width: 100%; max-width: 420px; padding: 20px; text-align: center; position: relative; }
.countdown { font-size: 120px; font-weight: 700; color: #8B5CF6; margin: 60px 0; animation: pop 0.5s ease; }
.loading { color: #999; font-size: 14px; }
.dots span { display: inline-block; width: 6px; height: 6px; background: #D1D5DB; border-radius: 50%; margin: 0 3px; animation: blink 1.4s infinite; }
.dots span:nth-child(2){ animation-delay: 0.2s }
.dots span:nth-child(3){ animation-delay: 0.4s }
  @keyframes blink { 0%,80%,100%{opacity:0} 40%{opacity:1} }
  @keyframes pop { 0%{transform:scale(0.5);opacity:0} 100%{transform:scale(1);opacity:1} }
.card { background: white; border-radius: 20px; padding: 24px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); margin-top: 20px; }

/* Cake Baru */
.cake { width: 140px; height: 90px; margin: 20px auto; position: relative; }
.cake-base { width: 100%; height: 40px; background: #FBBF24; border-radius: 10px; position: absolute; bottom: 0; }
.cake-middle { width: 90%; height: 25px; background: #F472B6; border-radius: 8px; position: absolute; bottom: 35px; left: 5%; }
.cake-top { width: 80%; height: 20px; background: #93C5FD; border-radius: 8px; position: absolute; bottom: 55px; left: 10%; }
.sprinkle { position: absolute; width: 4px; height: 4px; background: white; border-radius: 50%; }
.candle { width: 10px; height: 35px; background: #60A5FA; margin: 0 auto; border-radius: 4px; position: absolute; bottom: 75px; left: 50%; transform: translateX(-50%); z-index: 2; }
.flame { width: 16px; height: 22px; background: radial-gradient(circle at 50% 30%, #FFD700, #FF8C00); border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%; position: absolute; top: -20px; left: -3px; animation: flicker 0.5s infinite alternate; cursor: pointer; }
  @keyframes flicker { from{transform:scale(1)} to{transform:scale(1.1)} }

.btns { display: flex; justify-content: center; gap: 12px; margin-top: 20px; }
.btn { width: 40px; height: 40px; border-radius: 50%; background: #8B5CF6; color: white; border: none; font-size: 18px; cursor: pointer; }
.confetti { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
.confetti-piece { position: absolute; width: 8px; height: 8px; background: #8B5CF6; opacity: 0; animation: fall 3s linear forwards; }
  @keyframes fall { to { transform: translateY(100vh) rotate(360deg); opacity: 1; }
.hidden { display: none; }
.handwritten { font-family: 'Comic Sans MS', cursive; font-size: 20px; line-height: 1.6; }
</style>
</head>
<body>

<div class="container">

  <!-- Screen 1: Countdown -->
  <div id="screen1">
    <div class="countdown" id="count">3</div>
    <div class="loading">just a moment</div>
    <div class="dots"><span></span><span></span><span></span></div>
  </div>

  <!-- Screen 2: Cake -->
  <div id="screen2" class="hidden">
    <div class="card">
      <div style="color:#E11D48; font-weight:600;">Make a Wish! 🎂</div>
      <div class="cake">
        <div class="cake-base"></div>
        <div class="cake-middle"></div>
        <div class="cake-top"></div>
        <div class="sprinkle" style="bottom: 60px; left: 20%;"></div>
        <div class="sprinkle" style="bottom: 65px; left: 40%; background: #F472B6;"></div>
        <div class="sprinkle" style="bottom: 58px; left: 70%; background: #FBBF24;"></div>
        <div class="candle"><div class="flame" id="flame"></div></div>
      </div>
      <div style="font-size:12px; color:#666;">Tap apinya untuk meniup lilin! 🕯️</div>
    </div>
  </div>

  <!-- Screen 3: Pages -->
  <div id="screen3" class="hidden">
    <div class="card">
      <div id="pageContent"></div>
      <div style="font-size:12px; color:#999; margin-top:10px;" id="pageNum"></div>
      <div class="btns">
        <button class="btn" onclick="prevPage()"><</button>
        <button class="btn" onclick="nextPage()">></button>
      </div>
    </div>
  </div>
</div>

<div class="confetti" id="confetti"></div>

<audio id="bgmusic" loop>
  <source src="birthday song.mp3" type="audio/mpeg">
</audio>

<script>
let step = 0;
let page = 0;
const music = document.getElementById('bgmusic');
const flame = document.getElementById('flame');

// Auto play music on first tap/interaction di layar
document.body.addEventListener('click', () => {
  if(music.paused) music.play().catch(()=>{});
}, {once: true});

// Countdown
let count = 3;
const countEl = document.getElementById('count');
const interval = setInterval(() => {
  count--;
  if(count > 0) {
    countEl.textContent = count;
    countEl.style.animation = 'none';
    void countEl.offsetWidth;
    countEl.style.animation = 'pop 0.5s ease';
  } else {
    clearInterval(interval);
    showConfetti();
    setTimeout(() => {
      document.getElementById('screen1').classList.add('hidden');
      document.getElementById('screen2').classList.remove('hidden');
    }, 1000);
  }
}, 1000);

// Blow candle
flame.addEventListener('click', () => {
  flame.style.display = 'none';
  showConfetti();
  setTimeout(() => {
    document.getElementById('screen2').classList.add('hidden');
    document.getElementById('screen3').classList.remove('hidden');
    renderPage();
  }, 800);
});

const pages = [
  `<div style="font-size:18px; font-weight:600; line-height:1.5;">to the person who got the "best person" stamp from me last year.</div>`,
  `<img src="https://cdn.photourl.com/free/2026-08-21-a4fcf1b1-7355-4c3a-b94d-0804bac8d71b.jpg" style="width:100%; border-radius:12px; margin-bottom:10px;">
   <div style="text-align:left; font-size:14px; line-height:1.7;">
   <b>happy birthday to a genuinely good person.</b><br><br>
   you inspire me in so many quiet ways — through how you care, how you stay real, and how you choose kindness even on hard days. i hope life keeps treating you as gently as you treat others. i hope you get to laugh a lot this year, feel proud of how far you’ve come, and collect so many beautiful little memories.<br><br>
   keep being the person who makes the world feel a little softer. keep smiling, keep growing, and never lose that heart of yours. i’m really grateful you exist, kael. be happy always.
   </div>`,
  `<div class="handwritten">
   <div style="color:orange;">☀️</div>
   <span style="color:#8B5CF6;">always rooting</span><br>
   <span style="color:#EC4899;">for you</span><br>
   <span style="color:#10B981;">from afar</span><br>
   </div>`
];

function renderPage(){
  document.getElementById('pageContent').innerHTML = pages[page];
  document.getElementById('pageNum').textContent = `Page ${page+1} of ${pages.length}`;
}
function nextPage(){ if(page < pages.length-1){ page++; renderPage(); } }
function prevPage(){ if(page > 0){ page--; renderPage(); } }

function showConfetti(){
  const confetti = document.getElementById('confetti');
  confetti.innerHTML = '';
  for(let i=0; i<50; i++){
    const piece = document.createElement('div');
    piece.className = 'confetti-piece';
    piece.style.left = Math.random()*100 + '%';
    piece.style.background = ['#8B5CF6','#EC4899','#F59E0B','#10B981'][Math.floor(Math.random()*4)];
    piece.style.animationDelay = Math.random()*0.5 + 's';
    confetti.appendChild(piece);
  }
}
</script>
</body>
</html>
